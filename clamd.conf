# ==============================================================================
# CONFIGURACIÓN PERSONALIZABLE DE CLAMAV DAEMON (clamd)
# ==============================================================================
# Este archivo configura el demonio de escaneo clamd del contenedor.
# Después de realizar modificaciones, reinicie el contenedor:
#   docker compose restart clamav
# ==============================================================================

# Habilitar el socket TCP para comunicación en la red interna de Docker
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /run/clamav/clamd.sock

# Base de datos de firmas (ruta interna del contenedor)
DatabaseDirectory /var/lib/clamav

# ==============================================================================
# LÍMITES DE ESCANEO (LIMITS)
# ==============================================================================

# Límite de tamaño de archivo individual a escanear.
# Archivos más grandes serán ignorados o generarán alertas según configuración.
# Valor por defecto: 100M (104857600 bytes)
MaxFileSize 100M

# Límite máximo total de datos analizados en un flujo o lote.
# Valor por defecto: 400M (419430400 bytes)
MaxScanSize 400M

# Cantidad máxima de archivos contenidos dentro de un comprimido (.zip, .rar, etc.).
# Valor por defecto: 10000
MaxFiles 10000

# Nivel de recursión máximo permitido al abrir contenedores de comprimidos.
# Valor por defecto: 17
MaxRecursion 17

# Límite de tamaño máximo para ejecutables integrados (Portable Executable).
# Valor por defecto: 40M
MaxEmbeddedPE 40M

# Límite máximo para la normalización de código HTML.
# Valor por defecto: 40M
MaxHTMLNormalize 40M

# Límite máximo para texto plano HTML sin etiquetas.
# Valor por defecto: 8M
MaxHTMLNoTags 8M

# Límite máximo para la normalización de scripts.
# Valor por defecto: 20M
MaxScriptNormalize 20M

# Límite máximo de reconocimiento en tipos de archivos Zip.
# Valor por defecto: 1M
MaxZipTypeRcg 1M

# Límite de particiones de disco o contenedores de discos a analizar.
# Valor por defecto: 50
MaxPartitions 50

# Cantidad máxima de iconos a extraer y verificar en ejecutables PE de Windows.
# Valor por defecto: 100
MaxIconsPE 100

# ==============================================================================
# CARACTERÍSTICAS Y FORMATOS SOPORTADOS (ANÁLISIS DINÁMICO)
# ==============================================================================
ScanPE yes          # Soporte para ejecutables (.exe, .dll)
ScanELF yes         # Soporte para ejecutables ELF de Linux
ScanMail yes        # Soporte para archivos de correo (.eml)
ScanPDF yes         # Soporte para análisis de documentos PDF
ScanHTML yes        # Soporte para análisis de scripts y código HTML
ScanOLE2 yes        # Soporte para documentos de oficina antiguos (.doc, .xls, .ppt)
ScanArchive yes     # Soporte para comprimidos (.zip, .rar, .tar, .gz)
ScanImage yes       # Soporte para análisis de metadatos/exploits en imágenes (.png, .jpg)

# ==============================================================================
# COMPORTAMIENTOS ADICIONALES
# ==============================================================================
# Alertar si un archivo excede los límites configurados
AlertExceedsMax no

# Frecuencia de autoverificación de integridad del demonio (en segundos)
SelfCheck 600
