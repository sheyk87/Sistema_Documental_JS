# gde_frontend/nginx.conf
# Fase 5: Nginx como proxy reverso + servidor de archivos estáticos
# El usuario solo interactúa con este Nginx. Backend y workers NO son accesibles desde afuera.

server {
    listen 80;
    server_name _;

    # === ARCHIVOS ESTÁTICOS DEL FRONTEND ===
    root /usr/share/nginx/html;
    index index.html;

    # Caché agresiva para assets estáticos (1 año para archivos versionados)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta no encontrada cae al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === PROXY REVERSO HACIA EL BACKEND API (red interna Docker) ===
    # OWASP A05: El backend NO expone puertos al exterior
    location /api/ {
        proxy_pass http://backend:3000;

        # Headers de proxy para que el backend conozca el origen real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para operaciones pesadas (upload de PDFs, firma)
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Tamaño máximo de upload — debe ser >= al límite de Multer (10MB) + overhead
        client_max_body_size 15M;

        # Buffering para respuestas grandes (descarga de PDFs encriptados)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;
    }

    # === SEGURIDAD: Headers HTTP (OWASP A05) ===
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Desactivar exposición de versión de Nginx
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
